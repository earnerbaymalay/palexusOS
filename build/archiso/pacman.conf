#
# /etc/pacman.conf — PalexusOS Archiso Build Configuration
#

[options]
HoldPkg     = pacman glibc
Architecture = x86_64 x86_64_v3
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 8
ILoveCandy
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# PalexusOS Local Native Package Repository (Built from packages/)
# Default SigLevel is 'Optional TrustAll' for local development builds.
# When a production release GPG signing key (PALEXUS_GPG_KEY) is deployed and keys
# are imported into the pacman keyring, switch this directive to:
#   SigLevel = Required DatabaseOptional
[palexusos]
SigLevel = Optional TrustAll
Server = file:///var/cache/palexusos-repo

# CachyOS x86-64-v3 Optimized Repositories (BORE Kernel & AVX2 Binaries)
[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# Upstream Arch Linux Rolling Repositories
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
