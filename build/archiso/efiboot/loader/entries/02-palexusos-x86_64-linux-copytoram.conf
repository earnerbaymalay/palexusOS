title    PalexusOS Live (Copy to RAM)
sort-key 02
linux    /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos
initrd   /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
options  archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=3 cow_spacesize=4G nowatchdog audit=0 split_lock_mitigate=0 console=tty0 console=ttyS0,115200 copytoram
