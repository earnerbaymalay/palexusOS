# TokenEconomizer Configuration for PalexusOS
# This file helps coding agents work more efficiently in the PalexusOS repository
# by learning from previous sessions and optimizing tool usage.

[agent]
# Agent settings
name = "Claude Code"

[repository]
# Repository information
name = "palexusOS"
owner = "earnerbaymalay"
url = "https://github.com/earnerbaymalay/palexusOS"

[mechanisms]
# Enable cost optimization mechanisms
micro_skills = true      # Learn repository-specific facts (build commands, paths, etc.)
tool_pruning = true      # Remove unused tools from subsequent sessions
failure_intervention = true  # Detect and redirect stuck sessions

[settings]
# Micro-skills parameters
micro_skill_sessions = 3  # Confirm facts after this many sessions
micro_skill_model_review = true  # Use model to propose new facts

# Tool pruning parameters
tool_prune_threshold = 10     # Mark tool unused after N prompts
tool_prune_session_min = 2    # Across at least M sessions
tool_prune_session_max = 5    # Or after S sessions of any length

# Failure intervention parameters
failure_confidence = 0.7      # Judge confidence threshold (0-1)
failure_max_redirects = 1     # Max redirects per turn

[context]
# Project context for sessions
project_name = "PalexusOS — AI-Native Sovereign Workstation"
primary_language = "Python, Bash, PKGBUILD"
key_directories = [
  "packages/",        # Arch Linux package definitions
  "build/",           # Build and ISO generation
  "overlay/",         # System configuration overlays
  "docs/",            # Documentation
  "docs/design-system/"  # Design system (NEW)
]

[learned_facts]
# Repository-specific facts learned from sessions
# These will be populated automatically as sessions run

[[learned_facts.build]]
command = "makepkg -si"
description = "Build Arch package in isolated chroot"
context = "Use for packages/ directory"

[[learned_facts.test]]
command = "./build/verify-gates.sh"
description = "Run 261-gate engineering verification suite"
context = "Verify package quality and security"

[[learned_facts.iso]]
command = "./build/build-iso.sh"
description = "Build native ISO and live environment"
context = "Creates reproducible PalexusOS ISO"

[[learned_facts.git]]
command = "git add docs/design-system/ && git commit"
description = "Commit design system changes"
context = "Design system is in docs/design-system/"

[design_system]
# Design system integration (NEW)
enabled = true
location = "docs/design-system/"
tokens_css = "docs/design-system/tokens.css"
tokens_json = "docs/design-system/tokens.json"

[tools_to_keep]
# Tools most useful in PalexusOS development
read = true      # Reading source files and documentation
edit = true      # Editing code and configs
write = true     # Writing new files
bash = true      # Running build commands
grep = true      # Searching codebase
glob = true      # Finding files by pattern

[tools_to_prune]
# Tools rarely used (TokenEconomizer will auto-prune unused)
# These are examples; actual pruning is based on session history
artifact = "rarely"      # Design artifacts (use separate design tool)
browser = "rarely"       # Web browsing (repo is local)
agent = "sometimes"      # Sub-agents (for complex tasks only)

[session_hints]
# Hints for future sessions in this repository
context = """
PalexusOS is an AI-native Linux distribution with:
- Arch Linux rolling base
- Monospace terminal culture (JetBrains Mono Nerd Font)
- Catppuccin Mocha Mauve color palette
- Cyberdeck aesthetic (dark obsidian + electric mauve)
- Design system in docs/design-system/

When working with:
- Packages: See PKGBUILD in packages/*/
- Build: Consult build/build-iso.sh
- Themes: Reference overlay/etc/skel/.themes/
- Design: Use docs/design-system/ tokens and components
- Tests: Run build/verify-gates.sh after changes
"""

[cost_tracking]
# Track costs across repository sessions
enabled = true
per_session = true  # Log cost per session
aggregate = true    # Aggregate costs across sessions
