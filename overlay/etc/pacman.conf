#
# /etc/pacman.conf — PalexusOS Package Manager Configuration
#
# See the pacman.conf(5) manpage for option and repository directives

[options]
HoldPkg     = pacman glibc
Architecture = x86_64 x86_64_v3

# Pacman Aesthetics & Performance
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 10
ILoveCandy
DownloadUser = alpm

# Security & Signature Verification
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

#
# Repositories
#
# The [palexusos] overlay repository takes precedence for Palexus AI core daemons,
# cyberdeck desktop packages, and distribution defaults.
# The [cachyos-v3] and [cachyos] repositories provide x86-64-v3 AVX2/BMI2 optimized
# packages and the linux-cachyos BORE scheduler kernel.
#

# PalexusOS Local Native Package Repository (Built from packages/)
# Default SigLevel is 'Optional TrustAll' for local development builds.
# When a production release GPG signing key (PALEXUS_GPG_KEY) is deployed and keys
# are imported into the pacman keyring, switch this directive to:
#   SigLevel = Required DatabaseOptional
[palexusos]
SigLevel = Optional TrustAll
Server = file:///var/cache/palexusos-repo

[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
