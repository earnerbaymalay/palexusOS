# /etc/sddm.conf.d/10-palexusos.conf
# PalexusOS Boot & Login Configuration:
# palexusos Qt6 greeter (palexus-greeter); SDDM's default Xsetup.

[Theme]
Current=palexusos
CursorTheme=Catppuccin-Mocha-Mauve-Cursors
Font=JetBrainsMono Nerd Font,10,-1,5,50,0,0,0,0,0

[X11]
MinimumVT=7
ServerArguments=-nolisten tcp

[Users]
RememberLastUser=true
RememberLastSession=true
HideUsers=git,ollama,palexus-daemon
