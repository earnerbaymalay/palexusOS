# Local checks that mirror .github/workflows/tests.yml.
# Keep the ruff and black versions and flags in step with that workflow.
#
#   pip install pre-commit
#   pre-commit install                        # ruff + black on every commit
#   pre-commit install --hook-type pre-push   # tests + perf budgets on push
#   pre-commit run --all-files                # run the commit hooks once by hand

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [--extend-ignore=E501]
        files: ^(palexus|tests)/

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black
        args: [--line-length=100]
        files: ^(palexus|tests)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: ^build/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
        # The eBPF guard's tests and docs contain key headers as detection fixtures.
        exclude: ^(tests/test_ebpf_guard\.py|docs/design/EBPF_SECRET_INTERCEPTOR\.md|packages/core/palexus-ebpf-guard/)

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest tests/ -q -p no:cacheprovider
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: perf-budgets
        name: performance budgets
        entry: python scripts/perf_baseline.py --check --runs 5
        language: system
        pass_filenames: false
        stages: [pre-push]
