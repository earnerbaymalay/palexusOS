name: Build & Verify PalexusOS Live ISO

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-gates:
    name: "Gate G1–G5 Verification Harness"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Verification Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-pytest python3-pyqt6 python3-pyqt6.qtquick python3-yaml jq qemu-system-x86 ovmf

      - name: Run ShellCheck on Build Scripts
        run: |
          shellcheck build/*.sh build/archiso/profiledef.sh build/archiso/airootfs/root/customize_airootfs.sh

      - name: Execute Verification Gates (G1-G5)
        run: |
          ./build/verify-gates.sh

      - name: Run Pytest Test Suite
        run: |
          pytest tests/

      - name: Run Dry-Run ISO Validation
        run: |
          ./build/build-iso.sh --dry-run

  build-iso:
    name: "Build Archiso Live Image (x86_64)"
    needs: verify-gates
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space for ISO Build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Build PalexusOS ISO in Privileged Arch Linux Container
        run: |
          docker run --privileged --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -euo pipefail -c "
              sed -i '/^\[options\]/a DisableDownloadTimeout' /etc/pacman.conf
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Syu --noconfirm archiso base-devel git sudo namcap shellcheck rust python python-pillow python-numpy
              git config --system --add safe.directory '*'
              useradd -m -G wheel -s /bin/bash builder 2>/dev/null || true
              install -d -m 0750 /etc/sudoers.d
              echo 'builder ALL=(ALL:ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
              echo 'nobody ALL=(ALL:ALL) NOPASSWD: ALL' > /etc/sudoers.d/nobody
              chmod 0440 /etc/sudoers.d/builder /etc/sudoers.d/nobody
              mkdir -p /workspace/out/repo /home/builder/.cargo
              chown -R builder:builder /workspace/out /workspace/packages /home/builder 2>/dev/null || true
              ./build/verify-gates.sh
              ./build/build-iso.sh --build-pkgs
            "

      - name: Generate Checksums
        run: |
          cd out
          sha256sum ./*.iso > SHA256SUMS
          sha512sum ./*.iso > SHA512SUMS
          cat SHA256SUMS
          cat SHA512SUMS

      - name: Upload ISO Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: palexusos-live-iso
          path: |
            out/*.iso
            out/*.sig
            out/SHA256SUMS
            out/SHA512SUMS
            out/BUILD_MANIFEST.txt
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: PalexusOS ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: |
            out/*.iso
            out/*.sig
            out/SHA256SUMS
            out/SHA512SUMS
            out/BUILD_MANIFEST.txt
