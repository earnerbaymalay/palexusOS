name: Build & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Verify package builds
        run: |
          python -m pip install build
          python -m build --wheel --no-isolation

      - name: Check package structure
        run: |
          unzip -l dist/*.whl | grep palexus/ || exit 1
          echo "✓ Package structure verified"

      - name: Run all tests
        run: |
          python -m pytest tests/ -q
          echo "✓ All tests passed"

      - name: Verify test count
        run: |
          test_count=$(python -m pytest tests/ --co -q | tail -1 | grep -oE '[0-9]+ test' | grep -oE '[0-9]+')
          if [ "$test_count" -lt 160 ]; then
            echo "Error: Expected at least 160 tests, got $test_count"
            exit 1
          fi
          echo "✓ $test_count tests verified"

  package-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --no-isolation

      - name: Build sdist
        run: |
          python -m build --sdist --no-isolation

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Verify distribution
        run: |
          ls -lh dist/
          echo "✓ Distribution built successfully"
