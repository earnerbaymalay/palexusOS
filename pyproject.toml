[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palexus"
version = "0.1.0"
description = "PalexusOS: AI-native Linux distribution core modules"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "earnerbaymalay", email = "earnerbaymalay@gmail.com"},
]
keywords = ["palexos", "linux", "ai", "design-system", "architecture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Operating System Kernels :: Linux",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black", "mypy", "ruff"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/earnerbaymalay/palexusOS"
Repository = "https://github.com/earnerbaymalay/palexusOS.git"
Documentation = "https://github.com/earnerbaymalay/palexusOS#development--architecture"
Issues = "https://github.com/earnerbaymalay/palexusOS/issues"

[tool.setuptools]
packages = ["palexus"]

[tool.setuptools.package-data]
palexus = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
