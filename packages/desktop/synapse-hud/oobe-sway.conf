# /usr/share/synapse-hud/oobe-sway.conf — kiosk compositor for first-boot setup.
# No bar, no launcher, no keybindings: the only thing on screen is the setup wizard.
output * bg #09090d solid_color
default_border none
default_floating_border none
focus_follows_mouse no
for_window [app_id="synapse-welcome"] fullscreen enable

exec "/usr/bin/synapse-welcome --oobe; swaymsg exit"
