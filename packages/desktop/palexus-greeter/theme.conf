[General]
# Wallpaper + accent: <design>-<accent> from /usr/share/backgrounds/palexusos/palexus-*.jpg
# (monolith|tower|carbon - mauve|tungsten|crimson|sapphire|emerald). Overridden by
# theme.conf.user, which `palexus-theme --sync-greeter` writes.
variant=monolith-mauve
# Pin a username; empty = last logged-in user, else the first account.
user=
# false = static trails/glow (reduced motion, very slow GPUs)
animations=true
# Wallpaper folder (empty = /usr/share/backgrounds/palexusos)
backgrounds=
