[general]
mode = "audit"
log_target = "journald"
notify_desktop = true

[network]
interfaces = []
exempt_loopback = true
exempt_subnets = ["127.0.0.0/8", "::1/128", "10.0.0.0/8", "192.168.0.0/16"]

[patterns]
block_private_keys = true
block_cloud_tokens = true
entropy_threshold = 4.65

[whitelist]
exempt_binaries = [
    "/usr/bin/ssh",
    "/usr/bin/git-remote-http",
    "/usr/bin/git",
    "/usr/bin/gpg"
]
