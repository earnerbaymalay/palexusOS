#
# PalexusOS Calamares: remove live-only packages from the installed system (runs in the
# target chroot, after packages). unpackfs copies the live rootfs, so without this the
# installer and the archiso initramfs hooks stay installed. A leading "-" ignores failure.
---
dontChroot: false
timeout: 300

script:
    - "-pacman -Rns --noconfirm cachyos-calamares mkinitcpio-archiso"
    - "rm -rf /etc/calamares"

i18n:
    name: "Removing the installer from the new system..."
