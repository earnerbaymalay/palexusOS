#
# PalexusOS Calamares GRUB config: writes /etc/default/grub before the bootloader step.
# This is the only module that sets GRUB_ENABLE_CRYPTODISK and rd.luks.uuid for encrypted
# installs, and it appends "splash" itself when plymouth is installed in the target.
# Replaces cachyos-calamares' default, which points at the CachyOS GRUB theme.
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params:
    - "quiet"
    - "nowatchdog"
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DISABLE_SUBMENU: false
    GRUB_DISABLE_OS_PROBER: false
    GRUB_DISABLE_RECOVERY: true
always_use_defaults: true
