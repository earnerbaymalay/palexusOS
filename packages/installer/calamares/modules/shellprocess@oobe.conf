#
# PalexusOS first-boot setup (runs in the target chroot, last before packages/bootloader).
# No account is created by the installer: the first boot logs into a kiosk session running
# the setup wizard, which creates the account and then removes the setup user and autologin.
---
dontChroot: false
timeout: 60

script:
    - "/usr/lib/palexus/palexus-oobe-arm"

i18n:
    name: "Preparing first-boot setup..."
