#
# PalexusOS Calamares Mount: Btrfs subvolume layout + mount options (read by the
# mount module in Calamares 3.3+, not partition.conf).
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    # No snapshot tool ships yet. If snapper is added, its create-config must reuse this
    # mounted subvolume (umount, rmdir, create-config, then remount) rather than nest one.
    - mountPoint: /.snapshots
      subvolume: /@snapshots
    - mountPoint: /var/log
      subvolume: /@var_log
mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:3, space_cache=v2 ]
      ssdOptions: [ discard=async ]
      nvmeOptions: [ discard=async ]
    - filesystem: ext4
      options: [ defaults, noatime, commit=60 ]
