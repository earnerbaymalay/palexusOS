#
# PalexusOS Calamares Live-Session Cleanup (runs in the target chroot)
# unpackfs copies the live rootfs verbatim; strip live-only credentials and give
# the installed system its own pacman keyring. A leading "-" ignores failure.
---
dontChroot: false
timeout: 300

script:
    - "rm -f /etc/sudoers.d/00-palexus-live"
    # Migrate live user custom onboarding preferences (theme, icons, Claude key, profile) to installed user(s)
    - 'if [ -d "/home/palexus/.config/palexus" ]; then for udir in /home/*; do if [ "$udir" != "/home/palexus" ] && [ -d "$udir" ]; then u=$(basename "$udir"); mkdir -p "$udir/.config/palexus"; cp -a /home/palexus/.config/palexus/. "$udir/.config/palexus/"; chown -R "$u:$u" "$udir/.config/palexus"; fi; done; fi'
    - "-userdel -r palexus"
    - "-systemctl disable pacman-init.service"
    - "rm -f /etc/systemd/system/pacman-init.service /etc/systemd/system/etc-pacman.d-gnupg.mount"
    # mkarchiso empties /boot: restore each kernel from its package's modules dir,
    # and drop the live-only archiso initramfs hooks (initcpio rebuilds after this)
    - 'for d in /usr/lib/modules/*/; do if [ -f "$d/pkgbase" ]; then install -Dm644 "$d/vmlinuz" "/boot/vmlinuz-$(cat "$d/pkgbase")"; fi; done'
    - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "rm -rf /etc/pacman.d/gnupg"
    - "pacman-key --init"
    - "pacman-key --populate"

i18n:
    name: "Removing live session credentials and initializing pacman keyring..."
