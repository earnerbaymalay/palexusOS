#
# PalexusOS Calamares User Creation
# The live session's NOPASSWD sudoers is removed by shellprocess@cleanup;
# installed users get password-protected sudo via wheel.
---
defaultGroups:
    - users
    - wheel
    - audio
    - video
    - input
    - network
    - storage
    - name: wireshark
      must_exist: false
      system: true
sudoersGroup: wheel
setRootPassword: false
doAutologin: false
