# Calamares Configuration for PalexusOS (x86-64-v3 / BORE / AI-Native)
---
modules-search: [ local ]

instances:
  - id: cleanup
    module: shellprocess
    config: shellprocess@cleanup.conf
  - id: oobe
    module: shellprocess
    config: shellprocess@oobe.conf
  - id: removelive
    module: shellprocess
    config: shellprocess@removelive.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - netinstall
      - partition
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - shellprocess@cleanup
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - initcpiocfg
      - initcpio
      - networkcfg
      - hwclock
      - services-systemd
      - shellprocess@oobe
      - grubcfg
      - bootloader
      - shellprocess@removelive
      # Optional packs last: a failed download must not leave the disk without a bootloader
      - packages
      - umount
  - show:
      - finished

branding: palexusos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
